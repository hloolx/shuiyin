<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>批量图片水印工具 - 本地处理 · 隐私安全</title>
    <meta name="description" content="批量图片水印工具：身份证、证件、照片一键加水印。完全在浏览器本地处理，不上传任何数据，支持平铺/单个水印、实时预览、批量导出 ZIP。" />
    <meta name="keywords" content="水印,图片水印,批量水印,身份证水印,证件水印,在线水印,本地处理" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="批量图片水印工具" />
    <meta property="og:url" content="https://in.wein.dev/" />
    <meta property="og:description" content="完全本地处理的图片水印工具，隐私安全，支持批量导出。" />
    <meta property="og:image" content="https://in.wein.dev/images/logo512.png" />
    <link rel="canonical" href="https://in.wein.dev/" />

    <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./images/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="水印工具" />

    <!-- 首帧前确定主题，避免暗色模式闪白 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('shuiyin:theme');
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.accent = 'neutral';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>本工具需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
