<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <!-- 移动端视口优化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="批量图片水印工具 - 完全本地处理，隐私安全，支持批量操作和实时预览" />
    <!-- 禁止电话号码自动检测 -->
    <meta name="format-detection" content="telephone=no" />
    <!-- 主题色 -->
    <meta name="theme-color" content="#1e40af" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <!-- 苹果设备优化 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="水印工具" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- 苹果图标 -->
    <link rel="apple-touch-icon" href="/images/logo192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/images/logo152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/images/logo167.png" />
    <!-- 启动画面 -->
    <link rel="apple-touch-startup-image" href="/images/splash.png" />
    <!-- 预连接优化 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>批量图片水印工具 - 本地处理 · 隐私安全</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
